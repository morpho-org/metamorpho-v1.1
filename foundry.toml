[profile.default]
ignored_warnings_from = ["lib"]
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
evm_version = "cancun"

[profile.default.fuzz]
runs = 2048

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "unused-import",
    "erc20-unchecked-transfer",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "unsafe-typecast",
    "asm-keccak256",
    "block-timestamp",
    "require-revert-in-loop",
    "calls-loop",
    "reentrancy-events",
    "uninitialized-local",
    "reentrancy-no-eth",
    "missing-zero-check",
    "unused-return",
    "arbitrary-send-erc20",
]
